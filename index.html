<title data-src>Knowledge Workshops Catalogue 2027</title>

<style data-src id="app-style">:root{--navy:#033667;--deep:#012447;--orange:#F47321;--orange-d:#d85f12;--white:#fff;--bg:#eef1f5;--line:#d9dfe7;--ink:#14263d;--muted:#5b6b7e;--ok:#1b7f4b;--bad:#b3261e;--sidebar:300px;--r:10px;--font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{display:flex;height:100vh;height:100dvh;width:100%;overflow:hidden}
/* sidebar */
#side{width:var(--sidebar);flex:none;background:var(--deep);color:#fff;display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.wordmark{font:700 29px/1 Georgia,"Times New Roman",serif;letter-spacing:.2px;color:#fff;margin:0}
.wordmark sup{font:600 10px var(--font);color:var(--orange);margin-left:2px;vertical-align:top}
.tag{display:block;margin-top:5px;font:italic 12px Georgia,serif;color:#b9c8dc;border-top:2px solid var(--orange);padding-top:5px;width:max-content}
.brand .sub{margin:10px 0 0;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#9fb2cc}
.searchbox{padding:12px 14px;position:relative}
.searchbox input{width:100%;height:42px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 38px 0 38px}
.searchbox input::placeholder{color:#a9bad1}
.searchbox>svg{position:absolute;left:25px;top:24px;color:#a9bad1;width:18px;height:18px;pointer-events:none}
.searchbox .clear{position:absolute;right:20px;top:17px;width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:#cfd9e8;display:grid;place-items:center}
#navwrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 8px 12px}
.nav-row{display:flex;align-items:stretch}
.nav-main{flex:1;min-width:0;text-align:left;background:transparent;border:0;color:#e7eef8;padding:10px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;min-height:42px}
.nav-main:hover,.nav-tog:hover,.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-main[aria-current=page],.nav-item[aria-current=page]{background:var(--orange);color:#fff}
.nav-tog{width:40px;flex:none;background:transparent;border:0;color:#b9c8dc;border-radius:8px;display:grid;place-items:center}
.nav-tog svg{transition:transform .18s}
.nav-tog[aria-expanded=true] svg{transform:rotate(90deg)}
.cat>.nav-row>.nav-main{font-weight:700;letter-spacing:.2px}
.cat.path>.nav-row>.nav-main:not([aria-current]){color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.sublist{margin:0 0 4px 14px;padding-left:8px;border-left:1px solid rgba(255,255,255,.14)}
.ws.path>.nav-row>.nav-main:not([aria-current]){color:#fff;font-weight:600}
.ws .nav-main{font-size:14px;min-height:38px;padding:7px 8px}
.nav-item{display:block;width:100%;text-align:left;background:transparent;border:0;color:#c8d5e7;padding:7px 10px;border-radius:7px;font-size:13px;min-height:34px}
.num{opacity:.65;font-variant-numeric:tabular-nums;margin-right:6px}
.txt{min-width:0;flex:1;overflow-wrap:anywhere}
.nav-sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
#results{padding:2px 8px 12px}
.res-info{font-size:12px;color:#a9bad1;padding:4px 8px 8px}
.res{display:block;width:100%;text-align:left;background:transparent;border:0;color:#fff;border-radius:8px;padding:8px 10px;min-height:44px}
.res:hover{background:rgba(255,255,255,.1)}
.res .k{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--orange);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px}
.res .l{font-weight:600;overflow-wrap:anywhere}
.res .s{display:block;font-size:12px;color:#a9bad1;overflow-wrap:anywhere}
.sidefoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:#eaf0f8}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--orange-d);border-color:var(--orange-d)}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover:not(:disabled){background:var(--deep)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:0;width:44px}
.btn.icon.sm{width:34px}
.btn.block{width:100%}
/* main */
#main{container-type:inline-size;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);min-height:0}
#topbar{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;min-height:58px}
#menubtn{display:none}.lbl-s{display:none}.ord-s{display:none}
.crumb{flex:1;min-width:0}
.crumb .t1{display:block;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .t2{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#preview{flex:none;background:#fff4ec;border-bottom:2px solid var(--orange);color:#7a3407;padding:6px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
#stage.zoomed{cursor:grab}#stage.panning{cursor:grabbing}
#pan{position:absolute;inset:10px}
.slide-img{position:absolute;display:block;max-width:none;max-height:none;object-fit:contain;image-rendering:auto;background:#fff;box-shadow:0 6px 28px rgba(1,36,71,.22);border-radius:2px;-webkit-user-drag:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(3,54,103,.18);border-top-color:var(--orange);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
#err .box{background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:var(--r);padding:18px 20px;max-width:480px;box-shadow:0 8px 30px rgba(1,36,71,.15)}
#err h2{margin:0 0 6px;font-size:18px;color:var(--bad)}
#err p{margin:0 0 12px;overflow-wrap:anywhere}
#wsbar{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center}
#wsbar .pages{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;grid-column:2}
#wsbar .only{color:var(--navy);font-weight:600;text-align:center}
.wb{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);background:#f7f9fc;border-radius:var(--r);padding:4px 12px;text-align:left;color:var(--navy);min-width:0;max-width:100%}
.wb:hover:not(:disabled){border-color:var(--navy);background:#eaf0f8}
.wb svg{color:var(--orange)}
.wb .k{display:block;font-weight:600;font-size:13px;line-height:1.15}
.wb .n{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;line-height:1.2}
.wb.prev{grid-column:1;justify-self:start}.wb.next{grid-column:3;justify-self:end;text-align:right;flex-direction:row-reverse}
.wb.next .n{margin-left:auto}
.ps{display:none}
.pg{min-height:44px;border-radius:var(--r);padding:0 16px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600}
.pg:hover{background:#eaf0f8}
.pg[aria-current=page]{background:var(--navy);color:#fff}
#bottombar{flex:none;position:relative;background:#fff;border-top:2px solid var(--navy);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.navgrp{display:flex;align-items:center;gap:10px}
.navbtn{min-height:48px;min-width:48px;padding:0 18px 0 12px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.navbtn .ic{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center}
.navbtn .ic svg{width:18px;height:18px;stroke-width:3}
.navbtn.next{background:var(--navy);color:#fff;padding:0 12px 0 18px}
.navbtn:hover:not(:disabled){box-shadow:0 3px 10px rgba(3,54,103,.28)}
.counter{min-width:84px;text-align:center;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:16px}
.counter small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.zgrp{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:#f7f9fc}
.zgrp .btn{border:0;background:transparent;min-height:44px}
.zlbl{min-width:54px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy);text-align:center;background:transparent;border:0;min-height:44px;border-radius:8px}
.zlbl:hover{background:#eaf0f8}
#dlmenu{position:absolute;right:14px;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(1,36,71,.25);padding:6px;min-width:280px;max-width:calc(100vw - 24px);z-index:20}
#dlmenu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px;min-height:44px;color:var(--ink)}
#dlmenu button:hover:not(:disabled),#dlmenu button:focus-visible{background:#eaf0f8}
#dlmenu small{display:block;color:var(--muted);font-size:12px}
#dlmenu svg{color:var(--orange)}
#busy{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:15;display:flex;gap:10px;align-items:center;max-width:90%}
#busy .spin{width:18px;height:18px;border-width:3px;border-color:rgba(255,255,255,.3);border-top-color:var(--orange)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw}
#scrim{display:none}
/* pseudo fullscreen (browsers without Fullscreen API) */
#app.pfs #side,#app.pfs #topbar,#app.pfs #preview{display:none}
/* dialogs */
dialog{border:0;border-radius:16px;padding:0;color:var(--ink);box-shadow:0 20px 60px rgba(1,36,71,.4);max-width:min(94vw,560px);width:100%}
dialog::backdrop{background:rgba(1,36,71,.55)}
.dlg{padding:22px}
.dlg h2{margin:0 0 10px;font-size:20px;color:var(--navy)}
.dlg p{margin:0 0 10px;overflow-wrap:anywhere}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dlg ol{padding-left:22px;margin:8px 0}
.dlg li{margin:6px 0}
.dlg code,.mono{font:13px ui-monospace,Consolas,monospace;background:#eef1f5;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
@media (max-width:900px){
 #side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:6px 0 30px rgba(0,0,0,.35)}
 #side.open{transform:none}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(1,36,71,.5);z-index:25;border:0}
 #menubtn{display:inline-flex}
 #pan{inset:6px}
}
@media (max-width:700px){
 #topbar{padding:6px 10px;gap:8px}
 #topbar .btn .lbl-l{display:none}
 #topbar .btn .lbl-s{display:inline}
}
@container (max-width:1000px){.wb .n{display:none}}
@container (max-width:700px){
 #wsbar{grid-template-columns:1fr 1fr;padding:6px 10px}
 #wsbar .pages{grid-column:1/-1;grid-row:1;gap:6px}
 .wb.prev{grid-column:1;grid-row:2;justify-self:stretch}.wb.next{grid-column:2;grid-row:2;justify-self:stretch}
 .pg{padding:0 12px;font-size:13px}
 .pl{display:none}.ps{display:inline}
 .ord-l{display:none}.ord-s{display:inline}
}
@media (max-width:640px){
 #bottombar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
 #bottombar .navgrp{display:contents}
 .navbtn{min-width:0;padding:0 8px;justify-content:center}
 .navbtn.prev{grid-column:1}.counter{grid-column:2}.navbtn.next{grid-column:3}
 .navbtn .t{display:inline}
 .tools{grid-column:1/-1;margin:0;justify-content:space-between}
 #dlmenu{right:10px;left:10px;min-width:0}
}
@media (max-width:400px){.zlbl{min-width:44px}.btn.icon{width:42px}.tools{gap:4px}.zgrp .btn{padding:0;width:40px}}
@media (max-width:330px){.navbtn .t{display:none}.navbtn{padding:0 6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

@media (max-height:500px){
 #topbar{min-height:44px;padding:3px 10px}.crumb .t2{display:none}
 #topbar .btn,#menubtn{min-height:40px}
 #wsbar{grid-template-columns:auto 1fr auto;padding:3px 10px;gap:6px}
 #wsbar .pages{grid-column:2;grid-row:1;flex-wrap:nowrap;overflow-x:auto}
 .wb.prev{grid-column:1;grid-row:1;justify-self:start}.wb.next{grid-column:3;grid-row:1;justify-self:end}
 .wb,.pg{min-height:40px}.wb .n{display:none}.pg{font-size:13px;white-space:nowrap}
 #bottombar{padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));gap:8px}
 .navbtn{min-height:44px}
 #pan{inset:4px}
}
#main:fullscreen #topbar{display:none}
#main:-webkit-full-screen #topbar{display:none}

/* ===== Map View ===== */
#mapview{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(14px,3vw,34px) clamp(12px,3vw,34px) 28px;background:var(--bg)}
#main.mapmode #mapview{display:block}
#main.mapmode #stage,#main.mapmode #wsbar,#main.mapmode #bottombar{display:none}
#app.mapmode #side,#app.mapmode #scrim,#app.mapmode #menubtn{display:none!important}
#viewbtn svg{color:var(--orange)}
.maphead{max-width:1240px;margin:0 auto 18px;text-align:center}
.maphead h2{margin:0;color:var(--navy);font-size:clamp(20px,3vw,28px)}
.maphead p{margin:4px 0 0;color:var(--muted)}
#mapgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@container (min-width:900px){#mapgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}}
.mcol{min-width:0}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;min-height:56px;padding:8px 12px;font-weight:700;transition:background .2s,color .2s,box-shadow .2s}
.mbtn:hover{box-shadow:0 4px 14px rgba(3,54,103,.22)}
.mbtn.l1{min-height:78px;font-size:18px;box-shadow:0 2px 8px rgba(3,54,103,.1)}
.mbtn.l2{min-height:52px;font-size:15px;border-width:1.5px;background:#f2f6fb}
.mbtn.l3{min-height:48px;font-size:14px;border-width:1.5px;border-color:#9db3cf;border-radius:12px}
.mic{width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.mic svg{width:22px;height:22px}
.mbtn .mt{flex:1;min-width:0;overflow-wrap:anywhere}
.mm{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.mch{display:grid;place-items:center;color:var(--orange)}
.mch svg{transition:transform .28s}
.mnode.open>.mbtn .mch svg{transform:rotate(180deg)}
.mnode.open>.mbtn{background:var(--navy);border-color:var(--navy);color:#fff}
.mnode.open>.mbtn .mm{color:#c8d5e7}
.msub{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s linear .3s}
.mnode.open>.msub{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.msub-in{overflow:hidden;min-height:0;transform-origin:top center;opacity:0;transform:scale(.9) translateY(-14px);transition:transform .3s ease,opacity .22s ease}
.mnode.open>.msub>.msub-in{opacity:1;transform:none}
.msub-pad{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px 14px;padding:4px 4px 4px 12px;border-left:3px solid var(--orange)}
.mleaf{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;border:1px solid var(--line);background:#f7f9fc;border-radius:10px;padding:6px 10px;color:var(--ink)}
.mleaf .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:#fff;background:var(--navy);border-radius:6px;min-width:30px;text-align:center;padding:3px 5px;flex:none}
.mleaf .mt{flex:1;min-width:0;overflow-wrap:anywhere}
.mleaf:hover{border-color:var(--orange);background:#fff4ec}
.mleaf[aria-current=page],.mbtn[aria-current=page]{background:var(--orange);border-color:var(--orange);color:#fff}
.mleaf[aria-current=page] .n{background:var(--deep)}
.mbtn[aria-current=page] .mm{color:#fff}
.mapfoot{max-width:1240px;margin:22px auto 0;display:flex;justify-content:center}
@media (max-width:700px){#viewbtn{padding:0 12px}}
</style>
</head>
